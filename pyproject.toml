[project]
name = "comp693-26s2-project-yonggang-chen-1157968"
version = "0.1.0"
description = "Aventro Motors RAG system"
readme = "README.md"
authors = [
    { name = "Yonggang-Chen-1173486", email = "Yonggang.Chen@lincolnuni.ac.nz" }
]
requires-python = ">=3.13"
dependencies = [
    # --- Document loading ---
    "beautifulsoup4>=4.12.3",
    "docx2txt>=0.8",
    "pypdf>=6.14.2",
    "unstructured[pptx]>=0.18.0",

    # --- Text splitting + core ---
    "langchain-core>=1.5.3",
    "langchain-community>=0.4.2",
    "langchain-text-splitters>=1.0.0",

    # --- Embedding (Google Gemini) ---
    "langchain-google-genai>=2.0.0",

    # --- Vector store ---
    "chromadb>=1.5.9",

    # --- LLM (Groq) ---
    "langchain-groq>=1.1.3",

    # --- Environment ---
    "python-dotenv>=1.2.2",

    # --- Numerics ---
    "numpy>=1.26.0",
]

[project.optional-dependencies]
dev = [
    "ipykernel>=7.3.0",
    "pytest>=8.0.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["rag*"]